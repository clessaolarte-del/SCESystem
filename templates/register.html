{% extends 'base.html' %}
{% block auth_content %}
<div class="form-card">
    <h2 style="margin-top: 0;">Welcome Back!</h2>
    <form method="POST" class="auth-form">
        <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required>
        </div>

        <div class="field">
            <label for="user_type">User Type</label>
            <select id="user_type" name="user_type">
                <option value="student">Student</option>
                <option value="staff">Staff / Faculty</option>
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Log In</button>
    </form>

    <p style="margin-top: 18px; text-align: center; color: #475569;">
        Don’t have an account? <a href="{{ url_for('register') }}" style="color: #1f5ab7; font-weight: 700;">Create Account</a>
    </p>

    <div style="margin-top: 18px; color: #475569; font-size: 0.9rem;">
        Demo login:<br>
        Student: student@example.com / student123<br>
        Staff: admin@example.com / admin123
    </div>
</div>
{% endblock %}
